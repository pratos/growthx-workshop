<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shipping Reliable Products</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reset.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/theme/white.min.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Spline+Sans+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body>
    <div class="reveal">
      <div class="slides">
        <section
          id="slides-source"
          data-markdown="slides.md"
          data-separator="^---$"
          data-separator-vertical="^--$"
          data-separator-notes="^Note:"
          data-charset="utf-8"
        ></section>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/reveal.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/plugin/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/plugin/notes/notes.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/plugin/highlight/highlight.min.js"></script>
    <script>
      // Each slide becomes an order ticket: running header with the order number and the item.
      function ticket() {
        const leaves = [...document.querySelectorAll(".reveal .slides section")].filter((s) => !s.querySelector("section"));
        let fig = 0;
        leaves.forEach((s, i) => {
          if (s.querySelector(".kot-hd")) return;
          const label = s.querySelector(".poster-label");
          const num = s.querySelector(".num");
          const btw = s.classList.contains("btw-slide");
          let item = label ? label.textContent : num ? num.textContent : "";
          if (btw) item = item.replace(/^\/btw\s*·?\s*/i, "");
          const hd = document.createElement("header");
          hd.className = "kot-hd";
          hd.setAttribute("aria-hidden", "true");
          const no = document.createElement("span");
          no.className = "no";
          no.textContent = "Order #" + String(i + 1).padStart(3, "0") + (btw ? " · /btw" : "");
          const it = document.createElement("span");
          it.className = "item";
          it.textContent = item;
          hd.append(no, it);
          const live = s.querySelector(".live");
          if (live) hd.append(live);
          s.prepend(hd);
          const cap = s.querySelector(".meme-slide .caption, .caption");
          if (s.querySelector(".meme-image") && cap) {
            const f = document.createElement("span");
            f.className = "fig";
            f.textContent = "FIG. " + String(++fig).padStart(2, "0");
            cap.prepend(f);
          }
        });
      }
      Reveal.on("ready", ticket);

      Reveal.initialize({
        hash: true,
        width: 1280,
        height: 720,
        margin: 0,
        center: false,
        transition: "none",
        backgroundTransition: "none",
        slideNumber: false,
        controls: false,
        progress: false,
        plugins: [RevealMarkdown, RevealNotes, RevealHighlight],
      });
    </script>
  </body>
</html>
