<!doctype html>
<html lang="en">
<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/4.5.0/anime.umd.min.js"></script>
<style>
  :root {
    --bg: #fffcf0; --fg: #100f0f; --muted: #6f6e69; --line: #cecdc3; --surface: #f2f0e5;
    --surface-alt: #e6e4d9; --accent: #205ea6; --accent-ink: #ffffff; --ok: #66800b; --warn: #ad8301;
    --font: ui-sans-serif, system-ui, -apple-system, "Inter", sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, monospace;
    --radius: 6px; --gutter: 16px;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1); --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #100f0f; --fg: #cecdc3; --muted: #878580; --line: #403e3c; --surface: #1c1b1a;
      --surface-alt: #282726; --accent: #4385be; --accent-ink: #100f0f; --ok: #879a39; --warn: #d0a215;
    }
  }
  :root[data-theme="dark"] {
    --bg: #100f0f; --fg: #cecdc3; --muted: #878580; --line: #403e3c; --surface: #1c1b1a;
    --surface-alt: #282726; --accent: #4385be; --accent-ink: #100f0f; --ok: #879a39; --warn: #d0a215;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 var(--font); }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header, main, footer { padding: 0 var(--gutter); max-width: 1480px; width: 100%; margin: 0 auto; }
  header { padding-top: 32px; padding-bottom: 4px; }
  h1 { margin: 0; font-size: clamp(24px, 2.6vw, 34px); line-height: 1.15; letter-spacing: -.02em; font-weight: 650; text-wrap: balance; max-width: 30ch; }
  .byline { margin: 10px 0 0; font-size: 13.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
  .byline b { color: var(--fg); font-weight: 550; }
  ::selection { background: color-mix(in oklab, var(--accent) 28%, transparent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  * { scrollbar-color: var(--line) transparent; scrollbar-width: thin; }
  .tabs { display: flex; gap: 6px; margin: 18px 0 0; flex-wrap: wrap; }
  .tabs button { font: inherit; font-size: 14px; padding: 6px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  main { display: grid; grid-template-columns: 1fr; gap: 18px; padding-top: 20px; padding-bottom: 28px; flex: 1; align-content: start; }
  .stage { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; height: min(62vh, 760px); min-height: 340px; overflow: hidden; transition: height .24s var(--ease-out); }
  .stage-controls { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
  .stage-controls button { font: inherit; font-size: 12.5px; padding: 5px 10px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 999px; cursor: pointer; transition: color .15s ease, border-color .15s ease; }
  @media (hover: hover) and (pointer: fine) { .stage-controls button:hover { color: var(--fg); } }
  .stage-controls button[aria-pressed="true"] { color: var(--fg); border-color: var(--fg); }

  #diagram { width: 100%; height: 100%; }

  .rail { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 40px; align-items: start; }

  .rail-text { max-width: 64ch; }
  .pele { --pele-bg: transparent; --pele-fg: var(--fg); --pele-muted: var(--muted); --pele-line: var(--fg);
          --pele-surface: var(--bg); --pele-surface-alt: var(--surface-alt); --pele-border: var(--line);
          --pele-accent: var(--accent); --pele-font: var(--font); --pele-font-mono: var(--mono); --pele-radius: 4px; }
  .pele-node, .pele-cluster, .pele-edge, .pele-edge-label { transition: opacity .18s var(--ease-out); }
  .pele-node.is-focus > :is(rect, path, polygon, ellipse, circle) { stroke: var(--accent); stroke-width: 2.25px; }

  .controls { display: flex; align-items: center; gap: 10px; padding-top: 4px; }
  .controls button { font: inherit; font-size: 14px; width: 40px; height: 36px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: var(--radius); cursor: pointer; transition: background-color .15s ease, border-color .15s ease; }
  @media (hover: hover) and (pointer: fine) { .controls button:not(:disabled):hover { border-color: var(--fg); } }

</main>
<footer><span id="hint">← → to step · f to fit all · r to reset · one question, one artifact</span><span id="status">standalone</span></footer>

<script>
(() => {
  const spec = JSON.parse(document.getElementById('spec').textContent);
  const $ = id => document.getElementById(id);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const D = reduced ? 0 : 1;
  const KIND = { 'architecture-map': 'Architecture map', 'state-explorer': 'State explorer', 'event-stream': 'Event stream', 'decision-report': 'Decision report', 'trace-view': 'Trace view' };

  let host = null, participant = null, decision = spec.decision || null;
  let optionId = spec.options?.[0]?.id ?? null;
  let stepIndex = 0, mounted = null, svg = null, running = null, camera = null, fitAll = false, full = null;

  const post = msg => { const m = { ...msg, artifactId: host?.artifactId, blockId: host?.blockId, planId: host?.planId }; if (host && window.parent !== window) window.parent.postMessage(m, '*'); else console.log('[viz-explainer]', m); };

  document.title = spec.question;
  $('question').textContent = spec.question;
  $('kind').textContent = KIND[spec.kind] || spec.kind;
  $('by').textContent = spec.meta?.builtBy || 'agent';
  $('at').textContent = spec.meta?.builtAt || '';
  $('source').textContent = spec.meta?.source || '';

  const steps = () => (spec.steps || []).filter(s => !s.option || s.option === optionId);
  const diagramText = () => spec.options ? spec.options.find(o => o.id === optionId)?.diagram : spec.diagram;

  function mount() {
    const el = $('diagram');
    mounted?.destroy();
    el.innerHTML = '';
    mounted = pele.mount(el, diagramText(), {
      idPrefix: (optionId || 'd') + '-',
      zoom: false,
      responsive: false,
      fontSize: 17,
      padding: 24,
      onRender: (r) => {
        svg = el.querySelector('svg');
        // The page owns the viewBox from here: Pele lays out at natural size, the camera decides what is on screen.
        full = [0, 0, r.width, r.height];
        svg.removeAttribute('width'); svg.removeAttribute('height');
        svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        Object.assign(view, { x: 0, y: 0, w: r.width, h: r.height }); writeView();
        fitStage();
        $('fit').hidden = fitsWhole();
        applyStep(stepIndex, false);
        updateReset();
      },
      onError: e => console.error('[viz-explainer] diagram error', e),
    });
  }

  function clearFocus() { svg?.querySelectorAll('.is-focus').forEach(n => n.classList.remove('is-focus')); }

  // Camera: the union of the focused elements' boxes, in SVG units, with room around it. Never zoom past 1:1 by much,
  // never tighter than a third of the map, so a single small node does not become a wall of text.
  function boxOf(elements) {
    const m = svg.getScreenCTM()?.inverse(); if (!m || !elements.length) return null;
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const el of elements) {
      const r = el.getBoundingClientRect();
      for (const [cx, cy] of [[r.left, r.top], [r.right, r.bottom]]) { const p = new DOMPoint(cx, cy).matrixTransform(m); x1 = Math.min(x1, p.x); y1 = Math.min(y1, p.y); x2 = Math.max(x2, p.x); y2 = Math.max(y2, p.y); }
    }
    const stage = $('diagram').getBoundingClientRect(); const aspect = stage.width / Math.max(1, stage.height);
    const pad = 64; let w = x2 - x1 + pad * 2, h = y2 - y1 + pad * 2;
    // Never zoom past 1.1:1, so labels stay readable instead of billboard-sized.
    const minW = Math.min(full[2], stage.width / 1.1);
    if (w < minW) w = minW;
    if (h < w / aspect) h = w / aspect; else w = h * aspect;
    const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2;
    // Keep the frame inside the map: a node at the edge shows its neighbours, not empty stage.
    const clamp = (v, size, total) => size >= total ? (total - size) / 2 : Math.min(Math.max(v, 0), total - size);
    return [clamp(cx - w / 2, w, full[2]), clamp(cy - h / 2, h, full[3]), w, h];
  }
  // The stage takes its height from the diagram's proportions, with headroom for the camera, so a wide map is not letterboxed.
  function fitStage() {
    if (!full) return;
    const stage = document.querySelector('.stage');
    // A diagram that fits at natural size gets a stage its own height and no camera. A wider one gets most of the viewport.
    const h = fitsWhole() ? full[3] + 32 : Math.max(innerHeight * 0.56, 420, stage.clientWidth * (full[3] / full[2]));
    stage.style.height = `${Math.round(Math.min(innerHeight * 0.64, Math.max(300, h)))}px`;
  }

  function fitsWhole() { const stage = document.querySelector('.stage'); return !!full && full[2] <= stage.clientWidth * 1.05; }

  // Tween a plain object and write the viewBox each frame: anime does not interpolate a four-number attribute string.
  const view = { x: 0, y: 0, w: 1, h: 1 };
  const writeView = () => svg?.setAttribute('viewBox', `${view.x} ${view.y} ${view.w} ${view.h}`);
  function moveCamera(box, animated) {
    if (!svg || !box) return;
    camera?.pause?.();
    const [x, y, w, h] = box;
    if (!animated || !D) { Object.assign(view, { x, y, w, h }); writeView(); return; }
    camera = anime.animate(view, { x, y, w, h, duration: 480, ease: 'inOutQuart', onUpdate: writeView });
  }
  $('fit').onclick = () => { fitAll = !fitAll; $('fit').setAttribute('aria-pressed', String(fitAll)); applyStep(stepIndex, true); updateReset(); };

  // Reset the view, not the record: step 1, first option, the step's own frame. A recorded decision is an event and stays.
  function reset() {
    fitAll = false; $('fit').setAttribute('aria-pressed', 'false');
    const first = spec.options?.[0]?.id ?? null;
    if (first && optionId !== first) {
      optionId = first; stepIndex = 0;
      [...$('tabs').children].forEach(t => t.setAttribute('aria-selected', String(t.dataset.id === first)));
      mount();
    } else go(0);
    history.replaceState(null, '', location.pathname + location.search);
    updateReset();
  }
  function updateReset() { $('reset').disabled = stepIndex === 0 && !fitAll && (!spec.options || optionId === spec.options[0].id); }
  $('reset').onclick = reset;

  function applyStep(i, animated) {
    const list = steps();
    const step = list[i];
    $('stepLabel').textContent = list.length ? `Step ${i + 1} of ${list.length}` : '';
    $('caption').textContent = step?.caption || '';
    $('evidence').innerHTML = (step?.evidence || []).map(e => `<li>${esc(e)}</li>`).join('');
    $('prev').disabled = i <= 0; $('next').disabled = i >= list.length - 1;
    $('dots').innerHTML = list.map((_, k) => `<i class="${k === i ? 'on' : ''}"></i>`).join('');
    if (!svg || !step) return;
    running?.complete?.();
    clearFocus();
    const nodes = svg.querySelectorAll('.pele-node, .pele-cluster');
    const edges = svg.querySelectorAll('.pele-edge, .pele-edge-label');
    const focusIds = step.focus || [], edgeIds = step.edges || [];
    const on = focusIds.map(id => svg.querySelector(`.pele-node[data-id="${id}"], .pele-cluster[data-id="${id}"]`)).filter(Boolean);
    const onEdges = edgeIds.map(id => svg.querySelector(`.pele-edge[data-id="${id}"]`)).filter(Boolean);
    // Frame the focus and both ends of every focused edge, so an arrow never points off screen.
    const ends = edgeIds.flatMap(id => (/^L_(.+)_(.+)_\d+$/.exec(id) ?? []).slice(1))
      .map(n => svg.querySelector(`.pele-node[data-id="${n}"]`)).filter(Boolean);
    moveCamera(fitAll || fitsWhole() || !(on.length || onEdges.length) ? full : boxOf([...on, ...onEdges, ...ends]), animated);
    const dim = focusIds.length || edgeIds.length ? 0.3 : 1;
    const dur = animated ? 180 * D : 0;
    anime.animate(nodes, { opacity: dim, duration: dur, ease: 'outQuad' });
    anime.animate(edges, { opacity: dim, duration: dur, ease: 'outQuad' });
    anime.animate(on, { opacity: 1, duration: dur, ease: 'outQuad' });
    on.forEach(n => n.classList.add('is-focus'));
    onEdges.forEach((g, k) => {
      g.classList.add('is-focus');
      anime.animate(g, { opacity: 1, duration: dur, ease: 'outQuad' });
      const label = svg.querySelector(`.pele-edge-label[data-id="${g.dataset.id}"]`); if (label) anime.animate(label, { opacity: 1, duration: dur });
      const path = g.querySelector('path');
      if (path && animated && D) {
        const [drawable] = anime.svg.createDrawable(path);
        running = anime.animate(drawable, { draw: ['0 0', '0 1'], duration: 420, delay: k * 120, ease: 'inOutQuad' });
      }
    });
    post({ type: 'greenhouse:step', index: i, id: step.id });
  }

  function go(i) {
    const n = steps().length; stepIndex = Math.max(0, Math.min(n - 1, i)); applyStep(stepIndex, true); updateReset();
    const id = steps()[stepIndex]?.id; if (id) history.replaceState(null, '', `#${id}`);
  }
  // Deep link: index.html#share opens on the step with that id.
  const fromHash = () => { const i = steps().findIndex(s => s.id === decodeURIComponent(location.hash.slice(1))); return i < 0 ? 0 : i; };
  stepIndex = fromHash();
  addEventListener('hashchange', () => go(fromHash()));
  $('prev').onclick = () => go(stepIndex - 1);
  $('next').onclick = () => go(stepIndex + 1);
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') go(stepIndex + 1); if (e.key === 'ArrowLeft') go(stepIndex - 1); if (e.key === 'f') $('fit').click(); if (e.key === 'r' || e.key === 'Home') reset(); });
  addEventListener('resize', () => { fitStage(); applyStep(stepIndex, false); });

  // Options: tabs, comparison, decision
  if (spec.options?.length) {
    const tabs = $('tabs'); tabs.hidden = false;
    tabs.innerHTML = spec.options.map(o => `<button role="tab" data-id="${esc(o.id)}" aria-selected="${o.id === optionId}">${esc(o.label)}</button>`).join('');
    tabs.onclick = e => { const b = e.target.closest('button'); if (!b) return; optionId = b.dataset.id; stepIndex = 0; [...tabs.children].forEach(t => t.setAttribute('aria-selected', t === b)); mount(); updateReset(); };

    const axes = [['Call sites touched', o => o.axes?.callSites ? `${o.axes.callSites.count}${o.axes.callSites.list?.length ? ' · ' + o.axes.callSites.list.map(esc).join(', ') : ''}` : ''], ['Mechanical vs judgement', o => esc(o.axes?.mechanical || '')], ['Silent behaviour changes', o => esc(o.axes?.silent || '')], ['Invariant at risk', o => esc(o.axes?.invariant || '')]];
    if (spec.options.some(o => o.axes)) {
      $('compare').hidden = false;
      $('compare').innerHTML = `<table><thead><tr><th></th>${spec.options.map(o => `<th>${esc(o.label)}</th>`).join('')}</tr></thead><tbody>${axes.map(([name, f]) => `<tr><td>${name}</td>${spec.options.map(o => `<td>${f(o)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }

    if (spec.kind === 'decision-report') {
      $('decide').hidden = false;
      renderOptions();
    }
  }

  function renderOptions() {
    $('options').innerHTML = spec.options.map(o => {
      const tried = o.tried ? `<span class="tried">tried · ${esc(o.tried.kind)} ${o.tried.ref ? (o.tried.href ? `<a href="${esc(o.tried.href)}">${esc(o.tried.ref)}</a>` : esc(o.tried.ref)) : ''}${o.tried.summary ? ' · ' + esc(o.tried.summary) : ''}</span>` : `<span class="tried no">not explored yet · cannot be chosen</span>`;
      const chosen = decision?.optionId === o.id;
      return `<div class="option ${chosen ? 'chosen' : ''}" data-id="${esc(o.id)}"><h3>${esc(o.label)}</h3><p>${esc(o.summary || '')}</p>${tried}<button ${(!o.tried || decision) ? 'disabled' : ''} data-choose="${esc(o.id)}">${chosen ? 'Chosen' : 'Choose'}</button></div>`;
    }).join('');
    if (decision) { $('lock').hidden = false; $('lock').textContent = `Decided by ${decision.by?.name || 'unknown'} · ${fmt(decision.at)} · ${spec.options.find(o => o.id === decision.optionId)?.label || decision.optionId}`; }
  }
  let pending = null;
  $('options').onclick = e => {
    const b = e.target.closest('button[data-choose]'); if (!b || b.disabled) return;
    pending = b.dataset.choose;
    if (participant) return commit();
    $('who').style.display = 'flex'; $('whoName').focus();
  };
  $('whoOk').onclick = () => { const n = $('whoName').value.trim(); if (!n) return; participant = { id: null, name: n, kind: 'person' }; $('who').style.display = 'none'; commit(); };
  function commit() {
    const o = spec.options.find(x => x.id === pending); if (!o) return;
    decision = { optionId: o.id, label: o.label, by: participant, at: new Date().toISOString(), tried: o.tried ? { kind: o.tried.kind, ref: o.tried.ref } : null };
    post({ type: 'greenhouse:decision', ...decision });
    renderOptions();
    $('status').textContent = host ? 'recorded in plan' : 'recorded locally (no host)';
  }

  // State-explorer proposals
  if (spec.proposals) {
    $('propose').hidden = false;
    $('pSend').onclick = () => { const m = { type: 'greenhouse:proposal', from: $('pFrom').value.trim(), to: $('pTo').value.trim(), command: $('pCmd').value.trim() }; if (!m.from || !m.to || !m.command) return; post(m); $('pSend').textContent = 'Proposed'; setTimeout(() => $('pSend').textContent = 'Propose', 1500); };
  }

  // Host protocol
  addEventListener('message', e => {
    const m = e.data; if (!m || m.type !== 'greenhouse:init') return;
    host = m; participant = m.participant || null;
    if (m.theme) for (const [k, v] of Object.entries(m.theme)) document.documentElement.style.setProperty(k, v);
    if (m.decision) { decision = m.decision; if (spec.options) renderOptions(); }
    $('status').textContent = `in plan · ${participant?.name || 'anonymous'}`;
  });
  post({ type: 'greenhouse:ready', kind: spec.kind, question: spec.question });

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function fmt(iso) { try { return new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }); } catch { return iso; } }

  mount();
})();
</script>
</body>
</html>
