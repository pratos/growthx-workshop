name: deploy
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
    inputs:
      stage: { description: "alchemy stage", default: "prod" }
concurrency: { group: deploy-${{ github.ref }}, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun test packages
      - name: generated types are current
        run: cd apps/api && bunx wrangler types && git diff --exit-code worker-configuration.d.ts
      - name: no destructive migration without a flag
        run: |
          if git diff --name-only ${{ github.event.before || 'HEAD~1' }} -- apps/api/migrations | xargs -r grep -liE '\b(drop|rename)\b'; then
            grep -q 'ALLOW_DESTRUCTIVE' <<< "${{ github.event.head_commit.message }}" || { echo "destructive migration needs ALLOW_DESTRUCTIVE in the commit message"; exit 1; }
          fi
  preview:
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", ALCHEMY_PASSWORD: "${{ secrets.ALCHEMY_PASSWORD }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun infra/alchemy.run.ts --stage pr-${{ github.event.number }}
  deploy:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment: production
    env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", ALCHEMY_PASSWORD: "${{ secrets.ALCHEMY_PASSWORD }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: stop if a D1 migration is pending (migrations are applied by hand, never here)
        run: scripts/deploy.sh ${{ inputs.stage || 'prod' }}
      - name: smoke
        run: curl -sf "$(cat .alchemy/last-api-url)/healthz" | jq -e '.ok == true'
  migrate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env: { CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}", CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: cd apps/api && bunx wrangler d1 migrations list greenhouse --remote
      - name: apply (manual trigger only)
        run: cd apps/api && bunx wrangler d1 migrations apply greenhouse --remote
